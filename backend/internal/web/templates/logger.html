{{define "logger"}}
<form method="post" action="/workouts/{{.Data.Workout.ID}}/log" x-data="workoutLogger(JSON.parse(atob('{{.Data.Exercises}}')))"><input type="hidden" name="_csrf" value="{{.CSRF}}"><header class="-mx-4 -mt-4 mb-4 bg-[#222] text-white px-4 pt-4"><div class="flex items-center justify-between pb-3"><a href="/workouts" class="text-[#3498db] text-2xl leading-none">‹</a><h1 class="font-medium text-lg" x-text="exercises[active].name"></h1><a class="text-[#3498db] text-sm" :href="'/exercises/history?name='+encodeURIComponent(exercises[active].name)">History</a></div><div class="grid grid-cols-3 text-center text-sm font-bold"><span class="border-b-4 border-[#3498db] py-3">TRACK</span><span class="py-3 text-zinc-400">HISTORY</span><span class="py-3 text-zinc-400">GRAPH</span></div></header><input type="hidden" name="date" value="{{.Data.Date}}"><template x-for="(exercise, exerciseIndex) in exercises" :key="exercise.key"><div x-show="active===exerciseIndex"><input type="hidden" :name="'exercise_name_'+exerciseIndex" :value="exercise.name"><section class="px-1"><h2 class="border-b-2 border-[#3498db] text-sm font-bold text-slate-600 pb-1">WEIGHT (kg)</h2><div class="grid grid-cols-[3.5rem_1fr_3.5rem] items-center gap-3 py-3"><button type="button" class="stepper" @click="weight=Math.max(0,weight-2.5)">−</button><input type="number" min="0" max="10000" step="0.5" class="track-value" x-model.number="weight"><button type="button" class="stepper" @click="weight+=2.5">+</button></div><h2 class="border-b-2 border-[#3498db] text-sm font-bold text-slate-600 pb-1">REPS</h2><div class="grid grid-cols-[3.5rem_1fr_3.5rem] items-center gap-3 py-3"><button type="button" class="stepper" @click="reps=Math.max(0,reps-1)">−</button><input type="number" min="0" max="10000" step="1" class="track-value" x-model.number="reps"><button type="button" class="stepper" @click="reps+=1">+</button></div><div class="grid grid-cols-2 gap-2"><button type="button" class="save-set" @click="save(exercise)">SAVE</button><button type="button" class="clear-set" @click="clear()">CLEAR</button></div><ol class="mt-4 divide-y"><template x-for="(set, setIndex) in exercise.sets" :key="set.key"><li><button type="button" class="w-full grid grid-cols-[2rem_2rem_1fr_1fr] text-left py-3" :class="selectedSet===setIndex?'bg-cyan-100':''" @click="select(exercise,setIndex)"><span class="text-slate-400">▤</span><b x-text="setIndex+1"></b><span><b x-text="set.weightKg"></b> kg</span><span><b x-text="set.reps"></b> reps</span></button></li></template></ol><input type="hidden" :name="'set_count_'+exerciseIndex" :value="exercise.sets.length"><template x-for="(set, setIndex) in exercise.sets" :key="'fields-'+set.key"><span><input type="hidden" :name="'weight_'+exerciseIndex+'_'+setIndex" :value="set.weightKg"><input type="hidden" :name="'reps_'+exerciseIndex+'_'+setIndex" :value="set.reps"></span></template></section></div></template><input type="hidden" name="exercise_count" :value="exercises.length"><nav class="fixed bottom-0 inset-x-0 bg-white border-t shadow-[0_-2px_8px_rgba(0,0,0,.12)] px-3 py-2 flex items-center justify-between gap-2"><button type="button" class="nav-arrow" @click="previous()" :disabled="active===0">‹</button><div class="text-center text-sm"><b x-text="active+1"></b> / <span x-text="exercises.length"></span><br><span class="text-slate-500">exercise</span></div><button type="button" class="nav-arrow" @click="next()" :disabled="active===exercises.length-1">›</button><button class="finish-workout">Finish</button></nav></form>
{{end}}
