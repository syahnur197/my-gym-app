services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8380:8080"
    volumes:
      - gym-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sh", "-c", "test -r /proc/1/status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gym-data:
